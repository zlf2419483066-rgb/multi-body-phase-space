[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-space-graphic-five"
version = "0.1.0"
description = "Staged five-body phase-space graphic structure enumeration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
drawing = ["matplotlib>=3.8"]
independence = ["sympy>=1.12"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
