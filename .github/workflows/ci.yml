name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q four-body/src four-body/tests four-body/examples five-body/src five-body/tests five-body/examples
      - name: Install both demos
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './four-body[drawing]'
          python -m pip install -e './five-body[independence,drawing]'
          python -m pip install ipywidgets ipython
      - name: Check process cleanup isolation
        run: python -m unittest discover -s five-body/tests -p 'test_process_cleanup5.py' -v
      - name: Test four-body demo
        run: python -m unittest discover -s four-body/tests -p 'test_*.py' -v
      - name: Test five-body demo
        run: python -m unittest discover -s five-body/tests -p 'test_*.py' -v

