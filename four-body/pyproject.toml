[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-space-graphic"
version = "0.1.0"
description = "Reference domain model for phase-space graphic-method enumeration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
drawing = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
